<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSToolKits</title>
   <link rel="icon" type="image/jpg" href="https://i.imgur.com/QWLMgK8.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 3rem 2.25rem;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.04);
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      margin-bottom: 1.75rem;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
    }

    .icon-wrapper svg {
      width: 34px;
      height: 34px;
      color: #6366f1;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 1.25rem;
    }

    .content-text {
      font-size: 0.95rem;
      color: #9ca3af;
      line-height: 1.7;
    }

    .content-text p {
      margin-bottom: 0.35rem;
    }

    .content-text p:last-child {
      margin-bottom: 0;
    }

    .copyright-notice {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      color: #6b7280;
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>

    <h1>This Website is Now Private</h1>
    
    <div class="content-text">
      <p>Access to this site is restricted.</p>
      <p>Creators & Developers &gt; Darel Miranda &amp; Morvan Hsu</p>
      <p>Contact us if you have any questions.</p>
    </div>

    <div class="copyright-notice">
      <p>&copy; 2026 NSToolkits. All rights reserved.</p>
      <p>Unauthorized use, copying, or redistribution of this website, or extension app is strictly prohibited.</p>
    </div>
  </main>

    <script>
        /* BACKGROUND BACKGROUND PARTICLE ENGINE */
        const canvas = document.getElementById("bg");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        let particles = [];
        for (let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.8,
                dx: (Math.random() - 0.5) * 0.4,
                dy: (Math.random() - 0.5) * 0.4
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        /* SECURE ENVIRONMENT HANDLERS */
        document.addEventListener("keydown", function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
                (e.ctrlKey && e.keyCode === 85) ||
                (e.ctrlKey && (e.key === "a" || e.key === "A"))) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && e.key === "C") {
                e.preventDefault();
            }
        });

        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("selectstart", e => e.preventDefault());
        document.addEventListener("dragstart", e => e.preventDefault());

        /* PRE-LOAD CACHE LOGIC ARCHITECTURE */
        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.getElementById("loader-wrapper");
            const LOADING_DURATION = 3500; 
            const ONE_HOUR = 3600000; 

            const lastLoad = localStorage.getItem("ns_v3_load_time");
            const now = Date.now();

            if (!lastLoad || (now - lastLoad) > ONE_HOUR) {
                setTimeout(() => {
                    document.body.classList.add("loaded");
                    localStorage.setItem("ns_v3_load_time", now);
                    setTimeout(() => { loader.style.display = "none"; }, 800);
                }, LOADING_DURATION);
            } else {
                loader.style.display = "none";
                document.body.classList.add("loaded");
            }
        });
    </script>
</body>
</html>
