<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NS Toolkit Dashboard</title>

    <link
        rel="icon"
        type="image/jpg"
        href="https://i.imgur.com/QWLMgK8.jpeg"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                'Inter',
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background:
                #0b0f19;

            color:
                #f3f4f6;

            min-height:
                100vh;

            padding:
                30px;

        }


        /* ========================================
           BACKGROUND
           ======================================== */

        body::before {

            content: "";

            position: fixed;

            width: 600px;

            height: 600px;

            background:
                radial-gradient(
                    circle,
                    rgba(99,102,241,0.10) 0%,
                    rgba(0,0,0,0) 70%
                );

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events:
                none;

        }


        /* ========================================
           MAIN CONTAINER
           ======================================== */

        .dashboard {

            position:
                relative;

            z-index:
                1;

            width:
                100%;

            max-width:
                1100px;

            margin:
                0 auto;

        }


        /* ========================================
           HEADER
           ======================================== */

        .header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            margin-bottom:
                30px;

        }


        .header-left h1 {

            font-size:
                1.8rem;

            color:
                #ffffff;

            margin-bottom:
                6px;

        }


        .header-left p {

            color:
                #9ca3af;

            font-size:
                0.9rem;

        }


        .header-right {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

        }


        .user-badge {

            padding:
                9px 14px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius:
                10px;

            background:
                rgba(17,24,39,0.7);

            color:
                #d1d5db;

            font-size:
                0.85rem;

        }


        .logout-button {

            padding:
                9px 14px;

            border:
                1px solid
                rgba(239,68,68,0.25);

            border-radius:
                10px;

            background:
                rgba(239,68,68,0.08);

            color:
                #f87171;

            cursor:
                pointer;

            font-family:
                inherit;

            font-weight:
                600;

        }


        .logout-button:hover {

            background:
                rgba(239,68,68,0.15);

        }


        /* ========================================
           WELCOME
           ======================================== */

        .welcome-card {

            padding:
                25px;

            margin-bottom:
                25px;

            background:
                rgba(17,24,39,0.75);

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius:
                18px;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

        }


        .welcome-card h2 {

            color:
                #ffffff;

            font-size:
                1.25rem;

            margin-bottom:
                7px;

        }


        .welcome-card p {

            color:
                #9ca3af;

            font-size:
                0.9rem;

        }


        /* ========================================
           PERFORMANCE
           ======================================== */

        .section-title {

            color:
                #ffffff;

            font-size:
                1.15rem;

            margin-bottom:
                15px;

        }


        .stats-grid {

            display:
                grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap:
                15px;

            margin-bottom:
                30px;

        }


        .stat-card {

            padding:
                22px;

            background:
                rgba(17,24,39,0.75);

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius:
                16px;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

        }


        .stat-label {

            color:
                #9ca3af;

            font-size:
                0.82rem;

            margin-bottom:
                10px;

        }


        .stat-value {

            color:
                #ffffff;

            font-size:
                1.65rem;

            font-weight:
                700;

        }


        /* ========================================
           ACCOUNT SETTINGS
           ======================================== */

        .settings-card {

            padding:
                25px;

            background:
                rgba(17,24,39,0.75);

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius:
                18px;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

        }


        .settings-card h2 {

            color:
                #ffffff;

            font-size:
                1.15rem;

            margin-bottom:
                7px;

        }


        .settings-description {

            color:
                #9ca3af;

            font-size:
                0.85rem;

            margin-bottom:
                20px;

        }


        .settings-field {

            margin-bottom:
                15px;

        }


        .settings-field label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                #d1d5db;

            font-size:
                0.83rem;

        }


        .settings-field input {

            width:
                100%;

            padding:
                12px 14px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius:
                9px;

            outline:
                none;

            background:
                rgba(0,0,0,0.25);

            color:
                #ffffff;

            font-family:
                inherit;

        }


        .settings-field input:focus {

            border-color:
                rgba(99,102,241,0.7);

            box-shadow:
                0 0 0 3px
                rgba(99,102,241,0.1);

        }


        .change-pin-button {

            width:
                100%;

            padding:
                12px;

            border:
                none;

            border-radius:
                9px;

            background:
                #6366f1;

            color:
                #ffffff;

            font-family:
                inherit;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                0.2s ease;

        }


        .change-pin-button:hover {

            background:
                #4f46e5;

            transform:
                translateY(-1px);

        }


        .change-pin-button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

            transform:
                none;

        }


        .pin-message {

            margin-top:
                12px;

            min-height:
                20px;

            font-size:
                0.85rem;

        }


        /* ========================================
           FOOTER
           ======================================== */

        .footer {

            margin-top:
                30px;

            text-align:
                center;

            color:
                #6b7280;

            font-size:
                0.75rem;

        }


        /* ========================================
           RESPONSIVE
           ======================================== */

        @media (
            max-width: 800px
        ) {

            .stats-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (
            max-width: 600px
        ) {

            body {

                padding:
                    18px;

            }


            .header {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            .header-right {

                width:
                    100%;

            }


            .user-badge {

                flex:
                    1;

            }


            .stats-grid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


    <main class="dashboard">


        <!-- =====================================
             HEADER
             ===================================== -->

        <header class="header">

            <div class="header-left">

                <h1>
                    NS Toolkit Dashboard
                </h1>

                <p id="team">
                    Team:
                </p>

            </div>


            <div class="header-right">

                <div
                    class="user-badge"
                    id="loggedUser"
                >
                    User
                </div>


                <button
                    type="button"
                    class="logout-button"
                    id="logoutButton"
                >
                    Logout
                </button>

            </div>

        </header>


        <!-- =====================================
             WELCOME
             ===================================== -->

        <section class="welcome-card">

            <h2 id="welcome">
                Welcome
            </h2>

            <p>
                Here is your current performance overview.
            </p>

        </section>


        <!-- =====================================
             PERFORMANCE
             ===================================== -->

        <section>

            <h2 class="section-title">
                Performance
            </h2>


            <div class="stats-grid">


                <div class="stat-card">

                    <div class="stat-label">
                        Quality
                    </div>

                    <div
                        class="stat-value"
                        id="quality"
                    >
                        --
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Productivity
                    </div>

                    <div
                        class="stat-value"
                        id="productivity"
                    >
                        --
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Attendance
                    </div>

                    <div
                        class="stat-value"
                        id="attendance"
                    >
                        --
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Callouts
                    </div>

                    <div
                        class="stat-value"
                        id="callouts"
                    >
                        --
                    </div>

                </div>


            </div>

        </section>


        <!-- =====================================
             SETTINGS
             ===================================== -->

        <section class="settings-card">

            <h2>
                Account Settings
            </h2>

            <p class="settings-description">
                Change your PIN for this account.
            </p>


            <div class="settings-field">

                <label for="currentPin">
                    Current PIN
                </label>

                <input
                    type="password"
                    id="currentPin"
                    placeholder="Enter current PIN"
                    autocomplete="current-password"
                >

            </div>


            <div class="settings-field">

                <label for="newPin">
                    New PIN
                </label>

                <input
                    type="password"
                    id="newPin"
                    placeholder="Enter new PIN"
                    autocomplete="new-password"
                >

            </div>


            <div class="settings-field">

                <label for="confirmPin">
                    Confirm New PIN
                </label>

                <input
                    type="password"
                    id="confirmPin"
                    placeholder="Confirm new PIN"
                    autocomplete="new-password"
                >

            </div>


            <button
                type="button"
                class="change-pin-button"
                id="changePinButton"
            >
                Change PIN
            </button>


            <div
                id="pinMessage"
                class="pin-message"
            ></div>

        </section>


        <footer class="footer">

            NS ToolKits v3

        </footer>


    </main>


<script src="./data/users.js"></script>
<script src="./js/auth.js"></script>
<script src="./dashboard.js"></script>


</body>

</html>
