<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSToolKits</title>
   <link rel="icon" type="image/jpg" href="https://i.imgur.com/QWLMgK8.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    /* ================================
       ADDED: Background Particles
       ================================ */
    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #particles .particle {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.7);
      box-shadow:
        0 0 6px rgba(99, 102, 241, 0.7),
        0 0 12px rgba(99, 102, 241, 0.35);
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% {
        transform: translate3d(0, 0, 0);
        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      50% {
        opacity: 0.45;
      }

      90% {
        opacity: 0.8;
      }

      100% {
        transform: translate3d(var(--particle-x), -110vh, 0);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 3rem 2.25rem;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.04);
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      margin-bottom: 1.75rem;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
    }

    .icon-wrapper svg {
      width: 34px;
      height: 34px;
      color: #6366f1;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 1.25rem;
    }

    .content-text {
      font-size: 0.95rem;
      color: #9ca3af;
      line-height: 1.7;
    }

    .content-text p {
      margin-bottom: 0.35rem;
    }

    .content-text p:last-child {
      margin-bottom: 0;
    }

    .copyright-notice {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      color: #6b7280;
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- ADDED: Particle background -->
  <div id="particles"></div>

  <main class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>

    <h1>This Website is Now Private</h1>
    
    <div class="content-text">
      <p>Access to this site is restricted.</p>
      <p>Creators & Developers &gt; Darel Miranda &amp; Morvan Hsu</p>
      <p>Contact us if you have any questions.</p>
    </div>

    <div class="copyright-notice">
      <p>&copy; 2026 NSToolkits. All rights reserved.</p>
      <p>Unauthorized use, copying, or redistribution of this website, or extension app is strictly prohibited.</p>
    </div>
  </main>

  <script>
document.addEventListener("keydown", function(e) {
  // Block F12 and common shortcuts (Ctrl+Shift+I/J, Ctrl+U)
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
    e.preventDefault();
    return false;
  }
});

document.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === "C") {
    e.preventDefault();
  }
});
// Optional: Disable right-click
document.addEventListener("contextmenu", e => e.preventDefault());


/* ========================================
   ADDED: Background Particle Generator
   ======================================== */

const particleContainer = document.getElementById("particles");

const particleCount = 45;

for (let i = 0; i < particleCount; i++) {
  const particle = document.createElement("span");

  particle.className = "particle";

  // Random horizontal starting position
  particle.style.left = Math.random() * 100 + "%";

  // Random particle size
  const size = Math.random() * 2.5 + 1;
  particle.style.width = size + "px";
  particle.style.height = size + "px";

  // Random upward movement speed
  particle.style.animationDuration =
    (Math.random() * 12 + 10) + "s";

  // Random starting delay
  particle.style.animationDelay =
    -(Math.random() * 20) + "s";

  // Random horizontal drift
  particle.style.setProperty(
    "--particle-x",
    (Math.random() * 160 - 80) + "px"
  );

  particleContainer.appendChild(particle);
}
</script>
</body>
</html>
